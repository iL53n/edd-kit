[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "edd-kit"
version = "0.1.0"
description = "Prepare executable acceptance criteria before implementing LLM features."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
deepeval = ["deepeval==4.2.3"]

[project.scripts]
edd = "edd_kit.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "mypy>=1.15,<2", "build>=1.2,<2", "uv>=0.8,<1", "hatchling>=1.27,<2", "twine>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/edd_kit"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
