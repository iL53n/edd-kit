name: Publish release to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Verify the tagged revision
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build the tagged distributions
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: uv.lock
          python-version: "3.12"
          enable-cache: false
      - name: Install the locked build environment
        run: uv sync --locked --group dev
      - name: Require the tag to match the package version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Validate distribution metadata
        run: uv run --no-sync python -m twine check --strict dist/*
      - name: Exercise the uv tool install contract
        run: >-
          uv run --no-sync python scripts/smoke_tool_install.py
          --uv "$GITHUB_WORKSPACE/.venv/bin/uv"
          --wheel "$GITHUB_WORKSPACE"/dist/*.whl
          --python "$GITHUB_WORKSPACE/.venv/bin/python"
      - name: Upload checked distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish with PyPI trusted publishing
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/edd-kit
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Download checked distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Generate package attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
      - name: Publish
        run: uv publish --trusted-publishing always
